version: 2

models:
  - name: fct_order_details
    description: "Main fact table, denormalized, with all details of each order including payments and reviews."
    tests:
      - not_null_proportion:
          column_name: order_id
          at_least: 0.99
      - not_null_proportion:
          column_name: customer_id
          at_least: 0.99
      - not_null_proportion:
          column_name: total_payment_value
          at_least: 0.95
    columns:
      - name: order_id
        description: "Unique order identifier."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Identifier of the customer who placed the order."
      - name: purchase_timestamp
        description: "Purchase date and time."
      - name: approved_at
        description: "Order approval date and time."
      - name: delivered_to_carrier_at
        description: "Carrier delivery date and time."
      - name: delivered_to_customer_at
        description: "Customer delivery date and time."
      - name: estimated_delivery_at
        description: "Estimated delivery date."
      - name: order_status
        description: "Current order status."
      - name: average_review_score
        description: "Average review score of the order."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5
      - name: total_payment_value
        description: "Total value paid for the order, summing all payment methods."
      - name: credit_card_payment_value
        description: "Value paid with credit card."
      - name: boleto_payment_value
        description: "Value paid with boleto."
      - name: other_payment_value
        description: "Value paid with other payment methods."
      - name: voucher_payment_value
        description: "Value paid with voucher."

  - name: dim_customers
    description: "Customer dimension table, with one row per unique customer, summarizing their purchase behavior."
    tests:
      - not_null_proportion:
          column_name: customer_unique_id
          at_least: 0.99
      - not_null_proportion:
          column_name: lifetime_value
          at_least: 0.95
    columns:
      - name: customer_unique_id
        description: "Primary key. Unique customer identifier."
        tests:
          - not_null
          - unique
      - name: first_order_timestamp
        description: "Date and time of the customer's first purchase."
        tests:
          - not_null
      - name: last_order_timestamp
        description: "Date and time of the customer's last purchase."
        tests:
          - not_null
      - name: number_of_orders
        description: "Total quantity of orders made by the customer."
      - name: lifetime_value
        description: "Total sum of all values paid by the customer in all their orders."
      - name: last_city
        description: "City of the customer's last order."
      - name: last_state
        description: "State of the customer's last order."