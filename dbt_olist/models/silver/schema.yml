version: 2

models:
  - name: silver_orders
    description: "Central orders table. Each row represents a single order made on the Olist platform."
    columns:
      - name: order_id
        description: "Unique order identifier. Table primary key."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer purchase session identifier. Foreign key to silver_customers table."
        tests:
          - not_null
      - name: order_status
        description: "Current order status (e.g., delivered, shipped, canceled)."
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'processing', 'approved', 'invoiced', 'unavailable', 'created']
      - name: purchase_timestamp
        description: "Date and time when the purchase was made by the customer."
        tests:
          - not_null
      - name: approved_at
        description: "Date and time when the order payment was approved."
      - name: delivered_to_carrier_at
        description: "Date and time when the order was posted and delivered to the carrier."
      - name: delivered_to_customer_at
        description: "Date and time when the order was effectively delivered to the customer."
      - name: estimated_delivery_at
        description: "Estimated delivery date informed to the customer at the time of purchase."
        tests:
          - not_null

  - name: silver_order_items
    description: "Order items table. Each row represents a specific product within an order. An order can have multiple items."
    columns:
      - name: order_id
        description: "Identifier of the order to which the item belongs."
        tests:
          - not_null
      - name: order_item_id
        description: "Sequential number identifying items within the same order."
        tests:
          - not_null
      - name: product_id
        description: "Identifier of the sold product."
        tests:
          - not_null
      - name: seller_id
        description: "Identifier of the seller who sold the product."
        tests:
          - not_null
      - name: shipping_limit_at
        description: "Deadline date and time for the seller to ship the product."
        tests:
          - not_null
      - name: price
        description: "Product price (unit value)."
        tests:
          - not_null
          - positive_values
      - name: freight_value
        description: "Freight cost for the item."
        tests:
          - not_null

  - name: silver_order_payments
    description: "Order payment records. A single order can have multiple payment rows (e.g., part on card, part on voucher)."
    columns:
      - name: order_id
        description: "Identifier of the order related to the payment."
        tests:
          - not_null
      - name: payment_sequential
        description: "Payment sequence for the same order, if there is more than one."
        tests:
          - not_null
          - positive_values
      - name: payment_type
        description: "Payment method used (e.g., credit_card, boleto, voucher)."
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_installments
        description: "Number of installments chosen for the payment."
        tests:
          - not_null
          - positive_values
      - name: payment_value
        description: "Total value of this payment record."
        tests:
          - not_null
          - positive_values

  - name: silver_order_reviews
    description: "Reviews made by customers about their orders after delivery."
    columns:
      - name: review_id
        description: "Unique review identifier."
      - name: order_id
        description: "Identifier of the order that was reviewed."
        tests:
          - not_null
      - name: review_score
        description: "Review score assigned by the customer (from 1 to 5)."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: review_comment_title
        description: "Review comment title (optional)."
      - name: review_comment_message
        description: "Review comment message (optional)."
      - name: review_creation_timestamp
        description: "Date and time when the review form was sent by the customer."
        tests:
          - not_null
      - name: review_answer_timestamp
        description: "Date and time when the review was answered (by the seller or Olist)."

  - name: silver_products
    description: "Catalog table with information on each product sold on Olist."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Product category name in Portuguese."
      - name: product_name_length
        description: "Number of characters in the product name."
      - name: product_description_length
        description: "Number of characters in the product description."
      - name: product_photos_qty
        description: "Quantity of published product photos."
      - name: product_weight_g
        description: "Product weight in grams."
        tests:
          - not_null
          - positive_values
      - name: product_length_cm
        description: "Product length in centimeters."
        tests:
          - not_null
          - positive_values
      - name: product_height_cm
        description: "Product height in centimeters."
        tests:
          - not_null
          - positive_values
      - name: product_width_cm
        description: "Product width in centimeters."
        tests:
          - not_null
          - positive_values

  - name: silver_customers
    description: "Customer data. Each row is generated for each new purchase, so a customer can appear more than once."
    columns:
      - name: customer_id
        description: "Customer purchase session identifier. Primary key."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier of a customer. Used to group all purchases by the same person."
        tests:
          - not_null
      - name: customer_zip_code_prefix
        description: "First 5 digits of the customer's zip code."
        tests:
          - not_null
          - string_length_equal:
              length: 5
      - name: customer_city
        description: "Customer city."
        tests:
          - not_null
      - name: customer_state
        description: "Customer state (UF)."
        tests:
          - not_null
          - string_length_equal:
              length: 2

  - name: silver_sellers
    description: "Information about sellers who use the Olist platform."
    columns:
      - name: seller_id
        description: "Unique seller identifier."
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: "First 5 digits of the seller's zip code."
        tests:
          - not_null
          - string_length_equal:
              length: 5
      - name: seller_city
        description: "Seller city."
        tests:
          - not_null
      - name: seller_state
        description: "Seller state (UF)."
        tests:
          - not_null
          - string_length_equal:
              length: 2

  - name: silver_geolocation
    description: "Geolocation data containing latitude and longitude for Brazilian zip codes."
    columns:
      - name: zip_code_prefix
        description: "First 5 digits of the zip code."
        tests:
          - not_null
          - string_length_equal:
              length: 5
      - name: latitude
        description: "Latitude coordinate."
        tests:
          - not_null
      - name: longitude
        description: "Longitude coordinate."
        tests:
          - not_null
      - name: city
        description: "City name (with accent variations)."
        tests:
          - not_null
      - name: state
        description: "State acronym (UF)."
        tests:
          - not_null
          - string_length_equal:
              length: 2

  - name: silver_product_category_translation
    description: "Translation table (from-to) of product categories from Portuguese to English."
    columns:
      - name: product_category_name
        description: "Category name in Portuguese."
        tests:
          - unique
          - not_null
      - name: product_category_name_english
        description: "Category name in English."
        tests:
          - not_null