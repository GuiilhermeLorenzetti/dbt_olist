version: 2

sources:
  - name: bronze
    description: "Bronze layer with raw Olist data"
    schema: bronze
    tables:
      - name: olist_customers_dataset
        description: "Olist customers dataset"
        columns:
          - name: customer_id
            description: "Unique customer ID"
            tests:
              - not_null
          - name: customer_unique_id
            description: "Unique customer ID (unique identifier)"
            tests:
              - not_null
          - name: customer_zip_code_prefix
            description: "Customer zip code prefix"
          - name: customer_city
            description: "Customer city"
          - name: customer_state
            description: "Customer state"
      
      - name: olist_sellers_dataset
        description: "Olist sellers dataset"
        columns:
          - name: seller_id
            description: "Unique seller ID"
            tests:
              - not_null
              - unique
          - name: seller_zip_code_prefix
            description: "Seller zip code prefix"
          - name: seller_city
            description: "Seller city"
          - name: seller_state
            description: "Seller state"
      
      - name: olist_products_dataset
        description: "Olist products dataset"
        columns:
          - name: product_id
            description: "Unique product ID"
            tests:
              - not_null
              - unique
          - name: product_category_name
            description: "Product category name"
          - name: product_name_lenght
            description: "Product name length"
          - name: product_description_lenght
            description: "Product description length"
          - name: product_photos_qty
            description: "Product photos quantity"
          - name: product_weight_g
            description: "Product weight in grams"
          - name: product_length_cm
            description: "Product length in cm"
          - name: product_height_cm
            description: "Product height in cm"
          - name: product_width_cm
            description: "Product width in cm"
      
      - name: olist_orders_dataset
        description: "Olist orders dataset"
        columns:
          - name: order_id
            description: "Unique order ID"
            tests:
              - not_null
              - unique
          - name: customer_id
            description: "Customer ID"
            tests:
              - not_null
          - name: order_status
            description: "Order status"
          - name: order_purchase_timestamp
            description: "Purchase timestamp"
          - name: order_approved_at
            description: "Approval timestamp"
          - name: order_delivered_carrier_date
            description: "Carrier delivery date"
          - name: order_delivered_customer_date
            description: "Customer delivery date"
          - name: order_estimated_delivery_date
            description: "Estimated delivery date"
      
      - name: olist_order_items_dataset
        description: "Olist order items dataset"
        columns:
          - name: order_id
            description: "Order ID"
            tests:
              - not_null
          - name: order_item_id
            description: "Order item ID"
            tests:
              - not_null
          - name: product_id
            description: "Product ID"
            tests:
              - not_null
          - name: seller_id
            description: "Seller ID"
            tests:
              - not_null
          - name: shipping_limit_date
            description: "Shipping limit date"
          - name: price
            description: "Item price"
          - name: freight_value
            description: "Freight value"
      
      - name: olist_order_payments_dataset
        description: "Olist order payments dataset"
        columns:
          - name: order_id
            description: "Order ID"
            tests:
              - not_null
          - name: payment_sequential
            description: "Payment sequential"
          - name: payment_type
            description: "Payment type"
          - name: payment_installments
            description: "Number of installments"
          - name: payment_value
            description: "Payment value"
      
      - name: olist_order_reviews_dataset
        description: "Olist order reviews dataset"
        columns:
          - name: review_id
            description: "Unique review ID"
            tests:
              - not_null
          - name: order_id
            description: "Order ID"
            tests:
              - not_null
          - name: review_score
            description: "Review score"
          - name: review_comment_title
            description: "Comment title"
          - name: review_comment_message
            description: "Comment message"
          - name: review_creation_date
            description: "Review creation date"
          - name: review_answer_timestamp
            description: "Review answer timestamp"
      
      - name: olist_geolocation_dataset
        description: "Olist geolocation dataset"
        columns:
          - name: geolocation_zip_code_prefix
            description: "Zip code prefix"
            tests:
              - not_null
          - name: geolocation_lat
            description: "Latitude"
          - name: geolocation_lng
            description: "Longitude"
          - name: geolocation_city
            description: "City"
          - name: geolocation_state
            description: "State"
      
      - name: product_category_name_translation
        description: "Product category name translation"
        columns:
          - name: product_category_name
            description: "Category name in Portuguese"
            tests:
              - not_null
          - name: product_category_name_english
            description: "Category name in English"
            tests:
              - not_null
